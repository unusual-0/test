function ytLoad(){

    }

function cleanTrack(t){let title=String(t.title||''),artist=String(t.artist||'');title=title.replace(/\((official|lyric|lyrics|audio|music|video|visualizer|hd|4k|remaster)[^)]*\)|\[[^\]]*\]|【[^】]*】|\bofficial\b.*$/ig,'').replace(/\s*(ft\.|feat\.)\s.*$/i,'').trim();artist=artist.replace(/VEVO$/i,'').replace(/ - Topic$/i,'').trim();const m=title.match(/^(.+?)\s[-–—]\s(.+)$/);if(m){artist=m[1].trim();title=m[2].trim()}if(/^(youtube|local audio)$/i.test(artist))artist='';return{title,artist}}

function vttToLrc(v){const out=[];let prevLast='',prev='';for(const b of v.replace(/\r/g,'').split(/\n\n+/)){const ls=b.split('\n'),k=ls.findIndex(l=>l.includes('-->'));if(k<0)continue;const m=ls[k].match(/(?:(\d+):)?(\d{2}):(\d{2})[.,](\d{3})\s*-->/);if(!m)continue;const sec=(+m[1]||0)*3600+ +m[2]*60+ +m[3]+ +m[4]/1000;let tl=ls.slice(k+1).map(l=>l.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/\s+/g,' ').trim()).filter(Boolean);if(tl.length>1&&tl[0]===prevLast)tl=tl.slice(1);if(!tl.length)continue;prevLast=tl[tl.length-1];const txt=tl.join(' ');if(txt===prev||/^[\[(♪\s]*(music|applause|laughter)?[\])♪\s]*$/i.test(txt))continue;prev=txt;out.push('['+String(Math.floor(sec/60)).padStart(2,'0')+':'+(sec%60).toFixed(2).padStart(5,'0')+']'+txt)}return out.join('\n')}

function ytId(input){
  let raw=String(input||'').trim();
  const valid=v=>v&&/^[A-Za-z0-9_-]{11}$/.test(v)?v:null;
  if(valid(raw))return raw;
  if(!raw)return null;
  try{
    if(!/^https?:\/\//i.test(raw))raw='https://'+raw.replace(/^\/+/, '');
    const u=new URL(raw),host=u.hostname.toLowerCase().replace(/^www\./,'');
    const allowed=host==='youtu.be'||host==='youtube.com'||host==='m.youtube.com'||host==='music.youtube.com'||host==='youtube-nocookie.com';
    if(!allowed)return null;
    if(host==='youtu.be')return valid(u.pathname.split('/').filter(Boolean)[0]||'');
    const v=u.searchParams.get('v');if(v&&valid(v))return v;
    const parts=u.pathname.split('/').filter(Boolean);
    if(parts.length>=2&&['shorts','embed','live','v'].includes(parts[0]))return valid(parts[1]);
    if(parts.length===1&&valid(parts[0]))return valid(parts[0]);
    const nested=u.searchParams.get('u');if(nested){try{return ytId(decodeURIComponent(nested))}catch{}}
    return null;
  }catch{return null}
}
function addYoutubeUrl(raw){
  const v=ytId(raw);
  if(!v){const message='That link was not recognized. Copy a single video link from YouTube or YouTube Music (watch, youtu.be, Shorts, Live or Embed).';const status=$m('#cxmSearchStatus');if(status)status.textContent=message;playerNotice(message);return}
  if(!/^https?:$/.test(location.protocol)||location.origin==='null'){const message='You opened Chronos as a local file. YouTube requires an HTTP/HTTPS page referrer. Start Chronos on localhost or open its HTTPS website, then paste the link again.';playerNotice(message);const status=$m('#cxmSearchStatus');if(status)status.textContent=message;return}
  let index=L.findIndex(t=>t.type==='yt'&&t.vid===v);
  if(index<0){const t={id:'y'+Date.now(),type:'yt',vid:v,title:'YouTube video '+v,artist:'YouTube',thumb:`https://i.ytimg.com/vi/${v}/hqdefault.jpg`};index=addToQueue(t)}
  const status=$m('#cxmSearchStatus');if(status)status.textContent='Link added. Loading the visible YouTube player…';
  renderPage('queue');

}

  async function toggleStudySound(){
    const kind=state.prefs.sound;
    if(kind==='off'){stopStudySound();$('#stSoundStatus').textContent='Choose a sound first.';return;}
    if(kind==='custom'){
      try{const blob=await window.CX?.idb('get','study-custom-sound');if(!blob){$('#stSoundStatus').textContent='Upload an audio file first.';return;}stopStudySound();customAudioUrl=URL.createObjectURL(blob);customAudio=new Audio(customAudioUrl);customAudio.loop=true;customAudio.volume=state.prefs.soundVolume;await customAudio.play();$('#stSoundToggle').textContent='Playing';$('#stSoundStatus').textContent='Playing your uploaded audio.';}catch(e){$('#stSoundStatus').textContent='Could not play the selected file. '+e.message;}return;
    }
    try{
      stopStudySound();const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Web Audio is not supported in this browser.');
      audioCtx=new AC();await audioCtx.resume();const length=audioCtx.sampleRate*6,buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate),data=buffer.getChannelData(0);let brown=0;
      for(let i=0;i<length;i++){const white=Math.random()*2-1;if(kind==='brown'){brown=(brown+0.02*white)/1.02;data[i]=brown*3.5;}else data[i]=white*(kind==='rain'?0.52:0.24);}
      noiseSource=audioCtx.createBufferSource();noiseSource.buffer=buffer;noiseSource.loop=true;
      ambientFilter=audioCtx.createBiquadFilter();ambientFilter.type=kind==='brown'?'lowpass':kind==='rain'?'bandpass':'allpass';ambientFilter.frequency.value=kind==='brown'?260:kind==='rain'?1700:12000;ambientFilter.Q.value=kind==='rain'?0.6:0.7;

    }catch(e){$('#stSoundStatus').textContent=e.message||'Audio could not start.';}
  }
  function stopStudySound(){try{noiseSource?.stop();}catch{}try{noiseSource?.disconnect();ambientGain?.disconnect();ambientFilter?.disconnect();}catch{}noiseSource=null;ambientGain=null;ambientFilter=null;if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null;}if(customAudio){customAudio.pause();customAudio=null;}if(customAudioUrl){URL.revokeObjectURL(customAudioUrl);customAudioUrl=null;}if($('#stSoundToggle'))$('#stSoundToggle').textContent='Play sound';}

  /* IndexedDB and full backup / restore. */
  function openChronosDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('chronos-db');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  function reqPromise(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  function blobBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=()=>reject(r.error);r.readAsDataURL(blob);});}
  async function serializeIDBValue(v){if(v instanceof Blob)return {__chronosBlob:true,type:v.type||'application/octet-stream',data:await blobBase64(v)};if(Array.isArray(v))return Promise.all(v.map(serializeIDBValue));if(v&&typeof v==='object'){const o={};for(const [k,val]of Object.entries(v))o[k]=await serializeIDBValue(val);return o;}return v;}
  async function deserializeIDBValue(v){if(v&&v.__chronosBlob){const raw=atob(v.data),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return new Blob([arr],{type:v.type});}if(Array.isArray(v))return Promise.all(v.map(deserializeIDBValue));if(v&&typeof v==='object'){const o={};for(const[k,val]of Object.entries(v))o[k]=await deserializeIDBValue(val);return o;}return v;}
  async function collectIDB(){const db=await openChronosDB();try{const result={};for(const name of [...db.objectStoreNames]){const tx=db.transaction(name,'readonly'),store=tx.objectStore(name),keysReq=store.getAllKeys(),valuesReq=store.getAll(),[keys,values]=await Promise.all([reqPromise(keysReq),reqPromise(valuesReq)]);result[name]=[];for(let i=0;i<keys.length;i++)result[name].push({key:keys[i],value:await serializeIDBValue(values[i])});}return result;}finally{db.close();}}
  async function makeBackup(studyOnly=false){
    const status=$('#stBackupStatus');if(status)status.textContent='Preparing backup…';
    try{
      const local={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!studyOnly&&k.startsWith('chronos-'))local[k]=localStorage.getItem(k);}
      if(studyOnly)for(const k of Object.values(LS)){const v=localStorage.getItem(k);if(v!==null)local[k]=v;}
      const payload={app:'Chronos',backupVersion:1,createdAt:new Date().toISOString(),localStorage:local,indexedDB:studyOnly?{}:await collectIDB()};
      const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`chronos-${studyOnly?'study-':''}backup-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
      if(status)status.textContent=`Backup exported (${(blob.size/1024/1024).toFixed(2)} MB). Keep it somewhere safe.`;
    }catch(e){if(status)status.textContent='Backup failed: '+e.message;}
  }
  async function restoreBackup(file){
    const status=$('#stBackupStatus');if(!confirm('Restore this backup? Existing Chronos data on this browser will be overwritten. Export a backup first if you need to keep it.'))return;
    if(status)status.textContent='Restoring backup…';
    try{
      const data=JSON.parse(await file.text());if(data.app!=='Chronos'||!data.localStorage)throw new Error('This does not look like a Chronos backup.');
      Object.keys(localStorage).filter(k=>k.startsWith('chronos-')).forEach(k=>localStorage.removeItem(k));
      for(const[k,v]of Object.entries(data.localStorage))localStorage.setItem(k,v);
      if(data.indexedDB&&Object.keys(data.indexedDB).length){const prepared={};for(const [name,items] of Object.entries(data.indexedDB)){prepared[name]=[];for(const item of items)prepared[name].push({key:item.key,value:await deserializeIDBValue(item.value)});}const db=await openChronosDB();try{for(const name of Object.keys(prepared)){if(!db.objectStoreNames.contains(name))continue;await new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite'),store=tx.objectStore(name);store.clear();for(const item of prepared[name])store.put(item.value,item.key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}}finally{db.close();}}
      if(status)status.textContent='Restore complete. Reloading Chronos…';setTimeout(()=>location.reload(),700);
    }catch(e){if(status)status.textContent='Restore failed: '+e.message;}
  }

  renderSection();
  openSection('planner');
  // If a profile has an exam target date, make sure it is visible in the calendar context.
  console.info('Chronos Study Hub loaded.');
})();

</script>
<script type="module" id="cx-liquid-js">
/* Move music backdrop (video / cover art) out of the stage so it fills the whole music app */
const bgBox=document.createElement('div');bgBox.id='cxmBg';
['#cxmArtBg','#cxmVideoLayer','.cxm-stage-shade'].forEach(s=>{const e=document.querySelector(s);if(e)bgBox.appendChild(e)});
document.body.insertBefore(bgBox,document.getElementById('app'));
/* Liquid glass: per-size SVG displacement map used as backdrop-filter */
(()=>{
const chromium=/Chrome|Chromium|Edg\//.test(navigator.userAgent)&&!/OPR\/|Firefox/.test(navigator.userAgent);
if(!chromium)return;
const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');
svg.setAttribute('width','0');svg.setAttribute('height','0');svg.style.cssText='position:absolute;pointer-events:none';
const defs=document.createElementNS(NS,'defs');svg.appendChild(defs);document.body.appendChild(svg);
const SEL='.glass-button,.icon-btn,.glass-tab-bar,.cxm-mini-card,.cxm-icon-btn,.cxm-visual-switch,.cxm-stage-side-controls button,.cxm-focus-toggle';
document.getElementById('cxmAudioBtn')?.addEventListener('click',()=>document.getElementById(document.getElementById('cxmThumbMode').classList.contains('active')?'cxmVideoMode':'cxmThumbMode').click());
const cache=new Map();let uid=0;
function mapURL(w,h,r){
 const sc=Math.min(1,Math.sqrt(160000/(w*h))),cw=Math.max(2,Math.round(w*sc)),ch=Math.max(2,Math.round(h*sc)),rr=r*sc;
 const bez=Math.max(2,Math.min(Math.min(cw,ch)/2*.85,22*sc+6*sc));
 const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d'),im=x.createImageData(cw,ch),d=im.data;
 const hx=cw/2,hy=ch/2,bx=hx-rr,by=hy-rr;
 for(let j=0;j<ch;j++)for(let i=0;i<cw;i++){
  const px=i+.5-hx,py=j+.5-hy,qx=Math.abs(px)-bx,qy=Math.abs(py)-by;
  const ox=Math.max(qx,0),oy=Math.max(qy,0),sd=Math.hypot(ox,oy)+Math.min(Math.max(qx,qy),0)-rr,depth=-sd;
  let nx=0,ny=0;
  if(qx>0&&qy>0){const l=Math.hypot(qx,qy)||1;nx=Math.sign(px)*qx/l;ny=Math.sign(py)*qy/l}else if(qx>qy)nx=Math.sign(px)||1;else ny=Math.sign(py)||1;
  let m=0;if(depth>=0&&depth<bez){const t=depth/bez;m=1-Math.sqrt(1-(1-t)*(1-t))}
  const k=(j*cw+i)*4;d[k]=128-nx*m*127;d[k+1]=128-ny*m*127;d[k+2]=128;d[k+3]=255}
 x.putImageData(im,0,0);return{url:c.toDataURL('image/png'),bez:bez/sc};
}
function filterFor(w,h,r){
 const key=w+'x'+h+'x'+r;if(cache.has(key))return cache.get(key);
 const {url,bez}=mapURL(w,h,r),id='cxlg'+(++uid),f=document.createElementNS(NS,'filter');
 f.setAttribute('id',id);f.setAttribute('filterUnits','userSpaceOnUse');f.setAttribute('x','0');f.setAttribute('y','0');f.setAttribute('width',w);f.setAttribute('height',h);f.setAttribute('color-interpolation-filters','sRGB');
 const scale=Math.min(bez*1.7,46);
 f.innerHTML=`<feImage href="${url}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/>`;
 defs.appendChild(f);const v='url(#'+id+')';cache.set(key,v);return v;
}
function apply(el){
 const w=el.offsetWidth,h=el.offsetHeight;if(w<24||h<24||w*h>1.2e5){el.classList.remove('lg-on');return}
 let r=parseFloat(getComputedStyle(el).borderTopLeftRadius)||0;r=Math.min(r,Math.min(w,h)/2);
 el.style.setProperty('--lg',filterFor(w,h,Math.round(r)));el.classList.add('lg-on');
}
const ro=new ResizeObserver(es=>es.forEach(e=>apply(e.target))),seen=new WeakSet();let t=0;
function scan(){document.querySelectorAll(SEL).forEach(el=>{if(!seen.has(el)){seen.add(el);ro.observe(el)}})}
new MutationObserver(()=>{cancelAnimationFrame(t);t=requestAnimationFrame(scan)}).observe(document.body,{childList:true,subtree:true});
scan();
})();

</script>
